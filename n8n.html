<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Etsy Image Generator - 24Tool</title>

  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Flowbite -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.1/flowbite.min.css"
        rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.1/flowbite.min.js"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit&family=Itim&display=swap"
        rel="stylesheet">

  <style>

    body {
      font-family: 'Kanit', sans-serif;
      background-color: #ffffff;
      color: #333;
    }

  </style>

</head>


<body>

<!-- Navbar -->

<nav class="fixed top-0 left-0 w-full z-50"
     style="background-color:#f88581;">

  <div class="flex items-center justify-between max-w-screen-xl mx-auto p-4">

    <a href="index.html"
       class="flex items-center space-x-3">

      <img src="images/logo3.png"
           class="h-14 w-13"
           alt="Logo">

      <span class="text-2xl font-semibold text-white">
        Home
      </span>

    </a>

  </div>

</nav>


<!-- Main -->

<div class="pt-32 px-4">

  <div class="max-w-2xl mx-auto">

    <!-- Title -->

    <h1 class="text-4xl font-bold text-pink-600 text-center mb-3">
      🎨 Etsy Image Generator
    </h1>

    <p class="text-gray-600 text-center mb-10">
      สร้างภาพ Digital Product สำหรับ Etsy
    </p>


    <!-- Form -->

    <div class="bg-white border border-gray-200 rounded-xl shadow-lg p-6">

      <!-- Product Name -->

      <div class="mb-6">

        <label class="block mb-2 font-semibold text-gray-700">
          Product Name
        </label>

        <input
          type="text"
          id="product_name"
          placeholder="เช่น Black Cat Poster"
          class="w-full border border-gray-300 rounded-lg p-3
                 focus:ring-pink-500 focus:border-pink-500"
        >

      </div>


      <!-- Prompt -->

      <div class="mb-6">

        <label class="block mb-2 font-semibold text-gray-700">
          Image Prompt
        </label>

        <textarea
          id="image_prompt"
          rows="6"
          placeholder="เช่น A beautiful black cat sitting under the moon..."
          class="w-full border border-gray-300 rounded-lg p-3
                 focus:ring-pink-500 focus:border-pink-500"
        ></textarea>

      </div>


      <!-- Button -->

      <button
        id="generateBtn"
        onclick="generateImage()"
        class="w-full bg-pink-500 hover:bg-pink-600
               text-white font-bold py-3 px-6
               rounded-lg transition">

        🚀 Generate Image

      </button>


      <!-- Status -->

      <div
        id="status"
        class="hidden mt-6 p-4 rounded-lg text-center">
      </div>

    </div>

  </div>

</div>


<script>

async function generateImage() {

  const productName =
    document.getElementById('product_name').value.trim();

  const imagePrompt =
    document.getElementById('image_prompt').value.trim();

  const button =
    document.getElementById('generateBtn');

  const status =
    document.getElementById('status');


  // ตรวจสอบข้อมูล

  if (!productName || !imagePrompt) {

    status.className =
      'mt-6 p-4 rounded-lg text-center bg-red-100 text-red-700';

    status.textContent =
      'กรุณากรอก Product Name และ Image Prompt';

    return;

  }


  // Loading

  button.disabled = true;

  button.textContent = '⏳ กำลังสร้างภาพ...';

  status.className =
    'mt-6 p-4 rounded-lg text-center bg-blue-100 text-blue-700';

  status.textContent =
    'กำลังส่งข้อมูลไปยัง n8n...';


  try {

    const response = await fetch(
      'https://pregnant-eos-manager-challenged.trycloudflare.com/webhook-test/etsy-image-generator',
      {
        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({
          product_name: productName,
          image_prompt: imagePrompt
        })
      }
    );


    const result = await response.json();


    if (!response.ok) {
      throw new Error(
        result.message || 'n8n Webhook Error'
      );
    }


    // สำเร็จ

    status.className =
      'mt-6 p-4 rounded-lg text-center bg-green-100 text-green-700';

    status.textContent =
      '✅ ส่งงานไปยัง n8n สำเร็จแล้ว';


    console.log('n8n response:', result);


  } catch (error) {

    console.error(error);

    status.className =
      'mt-6 p-4 rounded-lg text-center bg-red-100 text-red-700';

    status.textContent =
      '❌ ไม่สามารถเชื่อมต่อ n8n ได้: ' +
      error.message;

  }


  button.disabled = false;

  button.textContent = '🚀 Generate Image';

}

</script>


</body>

</html>
