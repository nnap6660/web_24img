<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Etsy Image Generator</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap"
        rel="stylesheet">

  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background: #ffffff;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="bg-pink-400 p-4">
    <div class="max-w-screen-xl mx-auto">

      <a href="index.html"
         class="text-white text-2xl font-bold">
        🏠 24Tool
      </a>

    </div>
  </nav>


  <!-- Content -->
  <main class="max-w-2xl mx-auto px-4 pt-20">

    <h1 class="text-4xl font-bold text-pink-600 text-center mb-3">
      🎨 Etsy Image Generator
    </h1>

    <p class="text-gray-600 text-center mb-8">
      สร้างภาพ Digital Product สำหรับ Etsy
    </p>


    <div class="bg-white border rounded-xl shadow-lg p-6">

      <!-- Product Name -->
      <label class="block font-bold mb-2">
        Product Name
      </label>

      <input
        id="product_name"
        type="text"
        placeholder="เช่น Black Cat Poster"
        class="w-full border rounded-lg p-3 mb-6"
      >


      <!-- Prompt -->
      <label class="block font-bold mb-2">
        Image Prompt
      </label>

      <textarea
        id="image_prompt"
        rows="6"
        placeholder="เช่น A beautiful black cat..."
        class="w-full border rounded-lg p-3 mb-6"
      ></textarea>


      <!-- Button -->
      <button
        onclick="generateImage()"
        id="generateBtn"
        class="w-full bg-pink-500 hover:bg-pink-600
               text-white font-bold py-3 rounded-lg">

        🚀 Generate Image

      </button>


      <!-- Status -->
      <div
        id="status"
        class="mt-5 text-center">
      </div>

    </div>

  </main>


<script>

async function generateImage() {

  const productName =
    document.getElementById('product_name').value.trim();

  const imagePrompt =
    document.getElementById('image_prompt').value.trim();

  const status =
    document.getElementById('status');

  const button =
    document.getElementById('generateBtn');


  if (!productName || !imagePrompt) {

    status.innerHTML =
      '<p class="text-red-500">กรุณากรอกข้อมูลให้ครบ</p>';

    return;
  }


  button.disabled = true;

  button.textContent = '⏳ กำลังส่งข้อมูล...';

  status.innerHTML =
    '<p class="text-blue-500">กำลังเชื่อมต่อ n8n...</p>';


  try {

    const response = await fetch(
      'http://localhost:5678/webhook-test/etsy-image-generator',
      {
        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({
          product_name: productName,
          image_prompt: imagePrompt
        })
      }
    );


    const text = await response.text();

    console.log('n8n response:', text);


    if (!response.ok) {
      throw new Error(text);
    }


    status.innerHTML =
      '<p class="text-green-500 font-bold">' +
      '✅ ส่งข้อมูลไป n8n สำเร็จ' +
      '</p>';


  } catch (error) {

    console.error(error);

    status.innerHTML =
      '<p class="text-red-500">' +
      '❌ เชื่อมต่อ n8n ไม่สำเร็จ<br>' +
      error.message +
      '</p>';

  }


  button.disabled = false;

  button.textContent = '🚀 Generate Image';

}

</script>

</body>
</html>
